name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/ai-reviewer') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROJECT_CONTEXT: Secure AI-assisted GitHub PR reviewer. Comment-only MVP. AI receives sanitized diff and metadata only.
      PR_SUMMARY: ${{ github.event.pull_request.title || github.event.issue.title }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      CHECKOUT_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
      IS_FOLLOW_UP: ${{ github.event_name == 'issue_comment' }}

    steps:
      - name: Checkout trusted reviewer code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - name: Fetch PR head for diff only
        run: git fetch --no-tags origin "pull/${PR_NUMBER}/head:refs/remotes/origin/pr-head"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate workflow environment
        run: |
          test -n "$GITHUB_TOKEN" || { echo "::error::GITHUB_TOKEN is not available"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY secret is not available"; exit 1; }

      - name: Validate sanitized review input
        run: |
          if [ "$IS_FOLLOW_UP" = "true" ]; then
            python main.py \
              --github \
              --follow-up \
              --dry-run \
              --repo-path . \
              --project-context "$PROJECT_CONTEXT" \
              --pr-summary "$PR_SUMMARY" \
              >/tmp/ai-pr-review-input.json
          else
            python main.py \
              --github \
              --dry-run \
              --repo-path . \
              --project-context "$PROJECT_CONTEXT" \
              --pr-summary "$PR_SUMMARY" \
              >/tmp/ai-pr-review-input.json
          fi

      - name: Run AI PR review
        run: |
          if [ "$IS_FOLLOW_UP" = "true" ]; then
            python main.py \
              --github \
              --follow-up \
              --repo-path . \
              --project-context "$PROJECT_CONTEXT" \
              --pr-summary "$PR_SUMMARY"
          else
            python main.py \
              --github \
              --repo-path . \
              --project-context "$PROJECT_CONTEXT" \
              --pr-summary "$PR_SUMMARY"
          fi
