name: AI PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ github.token }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROJECT_CONTEXT: Secure AI-assisted GitHub PR reviewer. Comment-only MVP. AI receives sanitized diff and metadata only.
      PR_SUMMARY: ${{ github.event.pull_request.title }}

    steps:
      - name: Checkout trusted reviewer code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch PR head for diff only
        run: git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pr-head"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run AI PR review
        run: >-
          python main.py
          --github
          --repo-path .
          --project-context "$PROJECT_CONTEXT"
          --pr-summary "$PR_SUMMARY"
